name: Sugestão
description: Uma ideia de recurso, conteúdo ou melhoria
title: "[Sugestão]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pela ideia. O Tropeiro é feito para quando não há internet nem socorro; diga em que situação a sugestão ajuda.

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - Conteúdo novo (ficha, guia, documento oficial)
        - Recurso novo
        - Melhoria em algo que já existe
        - IA
        - Outro
    validations:
      required: true

  - type: textarea
    id: situacao
    attributes:
      label: Em que situação isso ajuda
      description: Quem precisa, quando e o que essa pessoa não consegue fazer hoje.
    validations:
      required: true

  - type: textarea
    id: proposta
    attributes:
      label: O que você propõe
    validations:
      required: true

  - type: textarea
    id: fonte
    attributes:
      label: Fonte oficial (se for conteúdo)
      description: Documento do Ministério da Saúde, da Anatel, da Defesa Civil etc. em que o conteúdo se basearia.

  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que você considerou

  - type: checkboxes
    id: ajuda
    attributes:
      label: Participação
      options:
        - label: Posso ajudar a fazer (código, conteúdo ou revisão)

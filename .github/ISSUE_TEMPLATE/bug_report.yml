name: Problema
description: Algo não funciona como deveria
title: "[Problema]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar. Antes de enviar:
        - procure nas issues abertas se alguém já relatou;
        - confira se está na versão mais recente;
        - tire dos logs e das imagens qualquer informação pessoal.

        **Erro de conteúdo** (uma dose errada, um passo de primeiros socorros que não bate com a fonte): use este formulário e diga a ficha e a fonte.
        **Falha de segurança**: não use issue pública; veja o [SECURITY.md](https://github.com/pavini/tropeiro/blob/tropeiro/SECURITY.md).

  - type: dropdown
    id: area
    attributes:
      label: Onde
      options:
        - Tela inicial e busca
        - Fichas, guias e conteúdo
        - Perguntar à IA
        - Remédios
        - Mapa
        - Biblioteca (Wikipedia, livros)
        - Montar, downloads e kits
        - Apps
        - Estado do servidor e atualização
        - Instalação
        - Outro
    validations:
      required: true

  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
      description: O que você fez, o que esperava e o que aconteceu.
    validations:
      required: true

  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra ...
        2. Toque em ...
        3. Aparece ...
    validations:
      required: true

  - type: input
    id: versao
    attributes:
      label: Versão do Tropeiro
      description: Aparece em Estado do servidor.
    validations:
      required: true

  - type: input
    id: sistema
    attributes:
      label: Sistema e máquina
      placeholder: "Ex.: Ubuntu 24.04, 16 GB de RAM, sem placa de vídeo"

  - type: input
    id: modelo
    attributes:
      label: Modelo de IA (se o problema for na IA)
      placeholder: "Ex.: llama3.1:8b, Ollama no próprio servidor"

  - type: textarea
    id: logs
    attributes:
      label: Logs ou mensagens de erro
      render: shell

  - type: textarea
    id: imagens
    attributes:
      label: Imagens
      description: Arraste capturas de tela para cá, se ajudarem.

  - type: checkboxes
    id: confirmacao
    attributes:
      label: Antes de enviar
      options:
        - label: Procurei nas issues e não achei o mesmo problema
          required: true
        - label: Tirei informações pessoais dos logs e das imagens
          required: true

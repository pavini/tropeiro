# Dependências para rodar o Tropeiro em modo de desenvolvimento.
# O app (admin/) roda direto na máquina; aqui sobem só MySQL e Redis.
name: tropeiro-dev

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: nomad
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ppassword']
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  mysql-data:
